services:
  postgres:
    image: postgres:15-alpine
    container_name: cdi_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-cdi_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cdi_local_2024}
      POSTGRES_DB: ${DB_NAME:-cdi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdi_admin} -d ${DB_NAME:-cdi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
